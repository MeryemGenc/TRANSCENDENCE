{% load static %}

<!DOCTYPE html>
<html lang="en" style="overflow: hidden;">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TRANSCENDENCE</title>

    <!-- CSS Dosyaları -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"> 
    <link rel="stylesheet" href="{% static 'css/index.css' %}">
    <link rel="stylesheet" href="{% static 'css/pong.css' %}">
    <link rel="stylesheet" href="{% static 'css/pong_3d.css' %}">
    <link rel="stylesheet" href="{% static 'css/tictactoe.css' %}">

    <!-- Importmap için JavaScript Modülleri -->
    <script type="importmap">
        {
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
          }
        }
    </script>
</head>

<body style="overflow: hidden;">

    <nav id="main_navbar" style="display: none!important;" class="navbar navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <button class="navbar-toggler me-auto mx-3" type="button" data-bs-toggle="offcanvas"
                data-bs-target="#offcanvasDarkNavbar" aria-controls="offcanvasDarkNavbar"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <span id="navbar_main_span" class="navbar-brand d-flex align-items-center ms-auto" href="#">
                <img id="profile_img_id" src="/static/images/userprofile.png" class="rounded profile-small-img mx-3" alt="Logo">
                <span id="navbar_label_span" >Intra Nickname</span>
            </span>
            <div class="offcanvas offcanvas-start text-bg-dark" tabindex="-1" id="offcanvasDarkNavbar"
                aria-labelledby="offcanvasDarkNavbarLabel">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="offcanvasDarkNavbarLabel">TRANSCENDENCE</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
                        aria-label="Close"></button>
                </div>
                <div class="offcanvas-body">
                    <ul class="navbar-nav justify-content-end flex-grow-1 pe-2">
                        <li class="nav-item">
                            <a data-translate="n_HOME" href="/dashboard" class="nav-link" data-link>${translate("n_HOME")}</a>
                        </li>
                        <li class="nav-item">
                            <a data-translate="n_LOGIN" href="/login" class="nav-link" data-link>${translate("n_LOGIN")}</a>
                        </li>
                        <li class="nav-item">
                            <a data-translate="n_GAMES" href="/games" class="nav-link" data-link>${translate("n_GAMES")}</a>
                        </li>
                        <li class="nav-item">
                            <a data-translate="n_SETTINGS" href="/settings" class="nav-link" data-link>${translate("n_SETTINGS")}</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="background-gradient">
        <div id="app"></div>
    </div>

    <!-- Statik JavaScript Dosyaları -->
    <script type="module" src="{% static 'js/api.js' %}"></script>
    <script type="module" src="{% static 'js/navbar.js' %}"></script>
    <script type="module" src="{% static 'js/login/login.js' %}"></script>
    <script type="module" src="{% static 'js/index.js' %}"></script>
    <script type="module" src="{% static 'js/LanguageManager.js' %}"></script>
    <script type="module" src="{% static 'js/games/games.js' %}"></script>
    <script type="module" src="{% static 'js/games/pong/twopong.js' %}"></script>
    <script type="module" src="{% static 'js/games/pong/fourpong.js' %}"></script>
    <script type="module" src="{% static 'js/games/tournament/tournament.js' %}"></script>
    <script type="module" src="{% static 'js/games/tournament/tournamentPong3d.js' %}"></script>
    <script type="module" src="{% static 'js/games/tournament/confetti.js' %}"></script>

    <!-- Harici CDN üzerinden gelen JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
