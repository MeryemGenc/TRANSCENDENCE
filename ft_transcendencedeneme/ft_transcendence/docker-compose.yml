
services:
  # Django Web Servisi
  db:
    image: postgres:13  # PostgreSQL versiyonunu belirtiyoruz
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    networks:
      app_network:
        aliases:
          - db
    restart: always  # Veritabanı servisi yeniden başlatılacak
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Verilerin kalıcı olması için volume ekliyoruz

  web:
    build: ./ # Dockerfile'ı bulunduğu dizinden alıyoruz
    container_name: "ft_transendence-web-1"
    extra_hosts:
      - "db:host-gateway"
    volumes:
      - ./static:/app/static
      - ./staticfiles:/app/staticfiles # db'nin host-gateway olarak adreslenmesi için
    command: bash -c "python manage.py migrate && gunicorn ft_transcendence.wsgi:application --bind 0.0.0.0:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
    ports:
      - "8000:8000"  # Django'nun 8000 portunu dışarıya açıyoruz
    depends_on:
      - db  # Web servisi, veritabanı servisine bağlıdır
    networks:
      app_network:
        aliases:
          - web 
    restart: always  # Konteynerın her zaman yeniden başlatılmasını sağlıyoruz

  # Nginx Servisi
  nginx:
    image: nginx:latest  # Nginx'in son sürümünü kullanıyoruz
    container_name: ft_transendence-nginx-1
    volumes:  # Nginx template dosyalarını bağlıyoruz
      - ./templates:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf  # Nginx yapılandırma dosyasını bağlıyoruz
      - ./staticfiles:/usr/share/nginx/html/static:ro 
      - ./certs:/etc/nginx/ssl:ro  # Frontend dosyalarını Nginx'e bağlıyoruz
    ports:
      - "80:80"
      - "443:443"  # Nginx'in 80 portunu dışarıya açıyoruz
    depends_on:
      - web  # Nginx, web servisine bağlıdır
    networks:
      app_network:  # Aynı ağı kullanacak şekilde ekliyoruz

# Kendi ağımızı tanımlıyoruz
networks:
  app_network:
    driver: bridge  # Bridge ağı kullanıyoruz

# Kalıcı veriler için volume tanımlıyoruz
volumes:
  postgres_data:
    driver: local  # PostgreSQL verilerinin kalıcı olması için volume kullanıyoruz
