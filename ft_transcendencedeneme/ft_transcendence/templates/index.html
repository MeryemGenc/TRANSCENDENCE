<!DOCTYPE html>
<html lang="en" style="overflow: hidden;">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TRANSCENDENCE</title>

    {% load static %}

    <!-- CSS Dosyaları -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"> 
    <link rel="stylesheet" href="{% static 'css/index.css' %}">
    <link rel="stylesheet" href="{% static 'css/pong.css' %}">
    <link rel="stylesheet" href="{% static 'css/pong_3d.css' %}">
    <link rel="stylesheet" href="{% static 'css/tictactoe.css' %}">

    <!-- Importmap için JavaScript Modülleri -->
    <script type="importmap">
        {
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
          }
        }
    </script>
</head>

<body style="overflow: hidden;">

    <nav id="main_navbar" style="display: none!important;" class="navbar navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <button class="navbar-toggler me-auto mx-3" type="button" data-bs-toggle="offcanvas"
                data-bs-target="#offcanvasDarkNavbar" aria-controls="offcanvasDarkNavbar"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <span id="navbar_main_span" class="navbar-brand d-flex align-items-center ms-auto" href="#">
                <img id="profile_img_id" src="/static/images/userprofile.png" class="rounded profile-small-img mx-3" alt="Logo">
                <span id="navbar_label_span" >Intra Nickname</span>
            </span>
            <div class="offcanvas offcanvas-start text-bg-dark" tabindex="-1" id="offcanvasDarkNavbar"
                aria-labelledby="offcanvasDarkNavbarLabel">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="offcanvasDarkNavbarLabel">TRANSCENDENCE</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
                        aria-label="Close"></button>
                </div>
                <div class="offcanvas-body">
                    <ul class="navbar-nav justify-content-end flex-grow-1 pe-2">
                        <li class="nav-item">
                            <a data-translate="n_HOME" href="/dashboard" class="nav-link" data-link>${translate("n_HOME")}</a>
                        </li>
                        <li class="nav-item">
                            <a data-translate="n_GAMES" href="/games" class="nav-link" data-link>${translate("n_GAMES")}</a>
                        </li>
                        <li class="nav-item">
                            <a data-translate="n_SETTINGS" href="/settings" class="nav-link" data-link>${translate("n_SETTINGS")}</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="background-gradient">
        <div id="app"></div>
    </div>

    
	<!-- Form Registration Modal-->
	<div class="modal fade" id="Modal-tournament" data-backdrop="static" tabindex="-1" aria-labelledby="ModalLabel" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered modal-lg">
		  <div class="modal-content bg-dark text-white">
			<div class="modal-header">
			  <h5 class="modal-title text-center w-100">Tournament Player Registration</h5>
			</div>
			<div class="modal-body">
			  <form id="playerForm">
				<div class="mb-3">
				  <label for="player1" class="form-label">Player 1 Nickname</label>
				  <input type="text" class="form-control" id="player1" placeholder="Enter Player 1 Nickname" required>
				</div>
				<div class="mb-3">
				  <label for="player2" class="form-label">Player 2 Nickname</label>
				  <input type="text" class="form-control" id="player2" placeholder="Enter Player 2 Nickname" required>
				</div>
				<div class="mb-3">
				  <label for="player3" class="form-label">Player 3 Nickname</label>
				  <input type="text" class="form-control" id="player3" placeholder="Enter Player 3 Nickname" required>
				</div>
				<div class="mb-3">
					<label for="player4" class="form-label">Player 4 Nickname</label>
					<input type="text" class="form-control" id="player4" placeholder="Enter Player 4 Nickname" required>
				  </div>
			  </form>
			</div>
			<div class="modal-footer">
			  <button type="button" class="btn btn-success" id="save_btn">Save</button>
			</div>
		  </div>
		</div>
	  </div>
	  
	<!-- modal -->


	<!-- Tournament Match Modal -->
	<div class="modal fade " id="Modal-tournament-match" tabindex="-1" aria-labelledby="Modal-match-label" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered modal-lg">
		  <div class="modal-content bg-dark text-white">
			<div class="modal-header justify-content-center">
			  <h5 id="modal_h5_modalname" class="modal-title text-center" id="exampleModalLabel">Tournament Matchmaking</h5>
			</div>
			<!-- Modal Body: 3 Eşit Parça -->
			<div id="modal_body_div" class="modal-body">
			  <div id="modal_body_row_div" class="row">
				<div id="modal_first_player_div" class="col-4 text-center border-end">
					<img src="#" id= "modal_img_first_player" class="rounded-circle mx-auto mb-3" style="width: 100px; height: 100px;">
					<p class="fs-2 text-bold" style="color: cyan" id="modal_first_player"> </p>
				</div>
				<div id="modal_vs_icon_div" class="col-4 text-center border-end">
				  <img src="./static/images/vs.png">
				</div>
				<div id="modal_second_player_div" class="col-4 text-center">
					<img src="#" id= "modal_img_second_player" class="rounded-circle mx-auto mb-3" style="width: 100px; height: 100px;">
					<p class="fs-2 text-bold" style="color: cyan" id="modal_second_player"> </p>
				</div>
			  </div>
			</div>
		
			<!-- Modal Footer: 2 Eşit Parça -->
			<div id="modal_footer_div" class="modal-footer d-flex justify-content-center align-items-start w-100">
				<div id="modal_footer_div_button" class="col-6 text-center">
					<h5 id="modal_h5_waiting" class="modal-title" id="exampleModalLabel">Waiting Players</h5>
					<br>
					<div class="row d-flex justify-content-center align-items-center">
						<div id="modal_waiting1_div" class="col-6 text-center border-end">
							<img src="#" id="modal_img_waiting_player1" class="rounded-circle mx-auto mb-3" style="width: 100px; height: 100px;">
							<p class="fs-2 text-bold" style="color: cyan;" id="modal_waiting_player1"> </p>
						</div>
						<div id="modal_waiting2_div" class="col-6 text-center">
							<img src="#" id="img_waiting_player2" class="rounded-circle mx-auto mb-3" style="width: 100px; height: 100px;">
							<p class="fs-2 text-bold" style="color: cyan;" id="modal_waiting_player2"> </p>
						</div>
					  </div>
					  <br>
					<button type="button" class="btn btn-success w-100" id="start_btn" data-bs-dismiss="modal">Start</button>
				</div>
			</div>
		  </div>
		</div>
	  </div>



    <!-- Statik JavaScript Dosyaları -->
    <script type="module" src="{% static 'js/api.js' %}"></script>
    <script type="module" src="{% static 'js/navbar.js' %}"></script>
    <script type="module" src="{% static 'js/login/login.js' %}"></script>
    <script type="module" src="{% static 'js/index.js' %}"></script>
    <script type="module" src="{% static 'js/LanguageManager.js' %}"></script>
    <script type="module" src="{% static 'js/games/games.js' %}"></script>
    <script type="module" src="{% static 'js/games/pong/twopong.js' %}"></script>
    <script type="module" src="{% static 'js/games/pong/fourpong.js' %}"></script>
    <script type="module" src="{% static 'js/games/tournament/tournament.js' %}"></script>
    <script type="module" src="{% static 'js/games/tournament/tournamentPong3d.js' %}"></script>
    <script type="module" src="{% static 'js/games/tournament/confetti.js' %}"></script>

 
    
    


    <!-- Harici CDN üzerinden gelen JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
